# Render Blueprint for the SelfTrack backend.
# Deploy via Render Dashboard → New → Blueprint, or use these values manually:
#   Root Directory: server
#   Build Command:  npm install && npm run build
#   Start Command:  npm start
#   Health Check:   /health
# Set MONGODB_URI and JWT_SECRET in the Render dashboard (marked sync: false).
services:
  - type: web
    name: selftrack-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in the Render dashboard — never commit
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # REQUIRED — your Vercel frontend origin (e.g. https://<app>.vercel.app). Requests arrive at Render with a Vercel Origin header; without this, the CSRF origin check rejects state-changing API calls.
      - key: COOKIE_SAMESITE
        value: lax # correct for the Vercel same-origin /api rewrite
